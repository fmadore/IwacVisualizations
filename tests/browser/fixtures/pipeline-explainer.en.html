    </div>
    <p class="iwac-vis-pipeline__lede">IWAC trains a statistical topic model, Latent Dirichlet Allocation (LDA), on the text of its newspaper articles. The model is never told what the topics are: it finds groups of words that tend to appear in the same articles.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Articles</p>
                    <p class="iwac-vis-pipeline__caption">The input is the OCR text of each French-language newspaper article.</p>
                    <p class="iwac-vis-pipeline__note">Islamic publications and scholarly references have models of their own.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Text preparation</p>
                    <p class="iwac-vis-pipeline__caption">Words are reduced to their dictionary form, and very common words are removed.</p>
                    <p class="iwac-vis-pipeline__note">Place names and other terms that would dominate every topic are set aside; frequent word pairs such as al_azhar stay together.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Word counts</p>
                    <p class="iwac-vis-pipeline__caption">Each article becomes a count of the words it uses; word order is discarded.</p>
                    <p class="iwac-vis-pipeline__note">Words found in very few articles, or in a large share of them, are left out.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Topic discovery</p>
                    <p class="iwac-vis-pipeline__caption">LDA infers 30 topics, each a list of words weighted by how strongly they belong to it.</p>
                    <p class="iwac-vis-pipeline__note">A topic’s label is simply its most characteristic words.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Topic mixtures</p>
                    <p class="iwac-vis-pipeline__caption">Each article receives a share of several topics; IWAC keeps its main topic and its three strongest.</p>
                    <p class="iwac-vis-pipeline__note">The Topic Explorer follows each topic across years, countries and newspapers.</p>
                </li>
            </ol>
        </section>
    </div>

    </div>
    <p class="iwac-vis-pipeline__lede">IWAC uses one of two routes, depending on what a document already has. New scans go to a multimodal model that reads the page image itself; noisy text from conventional OCR can be corrected instead. A document takes one route, not both.</p>

                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Scanned page</p>
                    <p class="iwac-vis-pipeline__caption">The document’s PDF goes to a multimodal model: Gemini reads it page by page, Mistral Document AI in a single request.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Reading order</p>
                    <p class="iwac-vis-pipeline__caption">The instructions set the order: main columns left to right and top to bottom, then headings, captions and sidebars.</p>
                    <p class="iwac-vis-pipeline__note">The model reads layout and text in one pass; the steps are drawn apart here.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Transcription</p>
                    <p class="iwac-vis-pipeline__caption">The model writes out the text, rejoining lines and words that the columns broke, and keeps the source wording.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Assembled text</p>
                    <p class="iwac-vis-pipeline__caption">The pages are joined with page markers and, after a preview, saved to the record with the name of the model.</p>
                    <p class="iwac-vis-pipeline__note">The scan stays beside the text: an unusual layout can still come out in the wrong order.</p>
                </li>
            </ol>
        </section>

                    <p class="iwac-vis-pipeline__name">Noisy OCR text</p>

                    <p class="iwac-vis-pipeline__caption">A very long text is cut into sections that the model can correct in one request.</p>

                    <p class="iwac-vis-pipeline__note">Historical names and spellings are kept as printed.</p>
                </li>

    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-3-title">How names in articles become links to authority records</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">An AI model reads each newspaper article and lists the persons, organisations, places and subjects it mentions. A name is only a mention until it is matched with IWAC’s authority files, which gather variant spellings under one record.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">

                    <p class="iwac-vis-pipeline__name">Extraction and normalisation</p>
                    <p class="iwac-vis-pipeline__caption">The model lists the names it finds, without titles such as El Hadj and with acronyms written out in full.</p>
                    <p class="iwac-vis-pipeline__note">Subjects are chosen from IWAC’s own vocabulary.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Reconciliation</p>
                    <p class="iwac-vis-pipeline__caption">Each name is compared with the authority records and their alternative forms: exact matches are accepted, close spellings only suggested.</p>
                    <p class="iwac-vis-pipeline__note">A name that fits several records is set aside rather than guessed.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Review</p>
                    <p class="iwac-vis-pipeline__caption">A researcher checks ambiguous names, close spellings and unknown entities, and accepts, corrects or rejects each proposal.</p>
                    <p class="iwac-vis-pipeline__note">A name with no record waits for a new authority record, created after curation.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Linking</p>
                    <p class="iwac-vis-pipeline__caption">Confirmed matches are added to the article as links: places under Spatial coverage, everything else under Subject.</p>

    <p class="iwac-vis-pipeline__lede">The Albani Zaria exhibition counts words, terms and names across the transcribed sermons and lessons of Shaykh Muhammad Auwal Albani Zaria. Every figure leads back to a passage, and every passage to its recording.</p>

    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-5-title">How an issue of an Islamic magazine gets its table of contents</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">Digitised Islamic magazines were first searchable only as whole issues. An AI model reads each issue page by page, follows every article across the pages it spans, and writes a table of contents that makes each article findable on its own.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Issue</p>
                    <p class="iwac-vis-pipeline__caption">Each digitised issue is split into single pages, and each page goes to a vision model on its own: Gemini, Claude or Mistral OCR.</p>
                    <p class="iwac-vis-pipeline__note">The issue itself stays whole in the collection.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Articles on each page</p>
                    <p class="iwac-vis-pipeline__caption">The model lists every article on the page: its title as printed, with its section in brackets, its authors and a short summary of what the page shows.</p>
                    <p class="iwac-vis-pipeline__note">Covers, advertisements and short notices are set aside; Arabic terms read correctly are kept.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Continuations</p>
                    <p class="iwac-vis-pipeline__caption">Markers such as “suite page 7” or “à suivre” are noted, so the parts of an article printed apart can be found again.</p>
                    <p class="iwac-vis-pipeline__note">An article that ends on a later page is listed there too, under its title or as a continuation.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Consolidation</p>
                    <p class="iwac-vis-pipeline__caption">A second pass merges the parts of each article, gathers its pages and authors, and writes one summary of four to six sentences.</p>
                    <p class="iwac-vis-pipeline__note">Parts are joined by title, by continuation markers and by subject; a long series in several parts may not merge correctly.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Table of contents</p>
                    <p class="iwac-vis-pipeline__caption">The index is saved to the issue’s Table of contents field: one entry per article, with its pages, title, authors and summary.</p>
                    <p class="iwac-vis-pipeline__note">The model that wrote it is recorded with the field; an update changes nothing else, after a backup and a confirmation.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">A table of contents read by a model guides a reader through the issue; it is not a catalogue record. An unusual layout can hide an article or turn an advertisement into one, a decorative heading can pass for a title, and every summary is selective: read the pages before citing an article.</p>
        <p class="iwac-vis-pipeline__example">Illustrative example: the issue, its titles and its pages are invented to show the method.</p>
    </figcaption>
</figure>

    <div class="iwac-vis-block iwac-vis-pipeline" data-base-path="" data-instance="pipeline-6">
<figure class="iwac-vis-pipeline__figure" data-preset="ask-ai" aria-labelledby="pipeline-6-title">
    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-6-title">How an AI assistant answers a question with IWAC</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">The IWAC MCP server lets an AI assistant you already use search the collection for you. The server supplies records and figures, read-only; the assistant plans the searches, reads what comes back and writes the answer.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Your question</p>
                    <p class="iwac-vis-pipeline__caption">You ask in any language, in Claude, ChatGPT or another assistant connected to IWAC; the assistant decides which IWAC tools to call.</p>
                    <p class="iwac-vis-pipeline__note">Most sources are in French, so the instructions have it search in French, with spelling variants, whatever language you write in.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Tool calls</p>
                    <p class="iwac-vis-pipeline__caption">The server offers 39 read-only tools: search the collection, read one record, look up a person or a place, count over time, compare countries.</p>
                    <p class="iwac-vis-pipeline__note">Built-in instructions, and an optional research skill, tell the assistant how to search, read and cite.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">The dataset</p>
                    <p class="iwac-vis-pipeline__caption">Each call is answered from IWAC’s research dataset on Hugging Face; the Claude Desktop extension keeps a copy on your computer.</p>
                    <p class="iwac-vis-pipeline__note">Search matches the words of the metadata and the OCR text, so a misread word stays hidden.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Results with their sources</p>
                    <p class="iwac-vis-pipeline__caption">Each result comes back with the link to its IWAC record, and each call records the version of the dataset that answered it.</p>
                    <p class="iwac-vis-pipeline__note">A warning says when a list was cut short or a kind of material could not be searched.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">The answer</p>
                    <p class="iwac-vis-pipeline__caption">The assistant may search again or open records, then writes the answer, citing each source by its IWAC link.</p>
                    <p class="iwac-vis-pipeline__note">The wording is the model’s, not IWAC’s: follow the links before relying on a claim.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">The server returns records; the assistant interprets them. A count describes what IWAC holds, not everything that was ever published, and an assistant can miss a spelling variant or misread a source: open the linked records before quoting them.</p>
        <p class="iwac-vis-pipeline__example">Illustrative example: the question, the tool calls and the results in the drawings are invented to show the method.</p>
    </figcaption>
</figure>

<figure class="iwac-vis-pipeline__figure" data-preset="press-attitudes" aria-labelledby="pipeline-7-title">
    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-7-title">How language models rate the press’s portrayal of Islam</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">Several large language models read the same newspaper articles, and each rates on its own how central Islam and Muslims are to an article, how positively or negatively they are portrayed, and how subjective the writing is.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Articles</p>
                    <p class="iwac-vis-pipeline__caption">The OCR text of each French- or English-language newspaper article is sent whole, one article at a time.</p>
                    <p class="iwac-vis-pipeline__note">Articles in Ewé, Kabiyè or Dendi, or with no language recorded, are left out: a few dozen in all.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">One task, several models</p>
                    <p class="iwac-vis-pipeline__caption">Every model receives the same instructions, in French, and rates the article independently of the others.</p>
                    <p class="iwac-vis-pipeline__note">Their settings are not identical: temperature and reasoning effort follow each provider.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Three ratings</p>
                    <p class="iwac-vis-pipeline__caption">Centrality runs from very central to not addressed, polarity from very positive to very negative, subjectivity from very objective to very subjective.</p>
                    <p class="iwac-vis-pipeline__note">When Islam is not addressed, polarity is “not applicable” and subjectivity is left empty.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Justifications</p>
                    <p class="iwac-vis-pipeline__caption">Each rating comes with a sentence or two citing the article, and every model’s ratings are saved to the article’s record, apart.</p>
                    <p class="iwac-vis-pipeline__note">An article’s page shows each model’s reasoning beside its rating.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Comparison</p>
                    <p class="iwac-vis-pipeline__caption">The atlas follows each model across years, countries, topics and newspapers, and measures how often the models agree.</p>
                    <p class="iwac-vis-pipeline__note">The atlas takes no majority vote: where the models disagree, the disagreement is shown.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">The ratings are model outputs, not facts about the articles. The models agree most on centrality and least on subjectivity, one model reads centrality differently from the rest, and a model asked again can change its answer: read the article and the justification before drawing a conclusion.</p>
        <p class="iwac-vis-pipeline__example">Illustrative example: the article, the ratings and the agreement in the drawings are invented to show the method.</p>
    </figcaption>
</figure>

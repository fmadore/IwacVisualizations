<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IWAC Albani Zaria sermons fixture</title>
    <script>
        const fixtureParams = new URLSearchParams(location.search);
        const fixtureLang = /^fr/i.test(fixtureParams.get('lang') || '') ? 'fr' : 'en';
        document.documentElement.lang = fixtureLang;
        // ?eager=1 renders every lazy section at once (P.lazyInit's no-
        // IntersectionObserver path), for a check that must see all six
        // sections without scrolling a real viewport through them.
        if (fixtureParams.get('eager')) window.IntersectionObserver = undefined;
    </script>
    <!-- iwac-core, then the block's own sheet (BlockRegistry: blockCss). -->
    <link rel="stylesheet" href="/asset/css/iwac-core.min.css">
    <link rel="stylesheet" href="/asset/css/blocks/albani-sermons.min.css">
    <style>
        main { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
    </style>
</head>
<body>
    <script src="/tests/browser/fixtures/theme-stand-in.js"></script>
    <script>
        // The bundles come from files/iwac-visualizations/albani-sermons/.
        // Serve tests/browser/fixtures/data/albani-sermons/ instead — built
        // by scripts/generate_albani_sermons.py from the test transcript —
        // or, with ?data=local, the generator's own output under asset/data/
        // (for previewing a real run). Anything else is refused.
        window.__fetched = [];
        (function () {
            const realFetch = window.fetch.bind(window);
            const base = fixtureParams.get('data') === 'local'
                ? '/asset/data/'
                : '/tests/browser/fixtures/data/';
            window.fetch = function (url, init) {
                const u = String(url);
                window.__fetched.push(u);
                const m = /\/files\/iwac-visualizations\/([^?]+)/.exec(u);
                if (m) return realFetch(base + m[1], init);
                return Promise.reject(new Error('unexpected fetch: ' + u));
            };
        })();
    </script>
    <main>
        <h1>Albani Zaria sermons</h1>
        <!-- What block-layout/_generic.phtml renders for the registry row. -->
        <div class="iwac-vis-block iwac-vis-albani"
             data-base-path=""
             data-site-base="/s/iwac"
             data-embed-slug="albani-sermons"
             data-embed-base="/s/iwac">
            <div class="iwac-vis-loading iwac-vis-albani__loading" role="status" aria-live="polite">
                <div class="iwac-vis-spinner" aria-hidden="true"></div>
                <span>Loading the Albani Zaria sermons&hellip;</span>
            </div>
        </div>
    </main>
    <!-- ECharts and the word-cloud extension from the test-only npm copies,
         then d3's UMD modules (they share one global, so d3-force comes
         last), then the bundles in Site\AssetPlan::bundles() order for
         chartOptions + concordance + table + d3. -->
    <script src="/node_modules/echarts/dist/echarts.min.js"></script>
    <script src="/node_modules/echarts-wordcloud/dist/echarts-wordcloud.min.js"></script>
    <script src="/node_modules/d3-dispatch/dist/d3-dispatch.min.js"></script>
    <script src="/node_modules/d3-quadtree/dist/d3-quadtree.min.js"></script>
    <script src="/node_modules/d3-timer/dist/d3-timer.min.js"></script>
    <script src="/node_modules/d3-force/dist/d3-force.min.js"></script>
    <script>
        document.write('<script src="/asset/js/dist/shared-core.' + fixtureLang + '.min.js"><\/script>');
    </script>
    <script src="/asset/js/dist/shared-charts.min.js"></script>
    <script src="/asset/js/dist/shared-ui.min.js"></script>
    <script src="/asset/js/dist/shared-d3.min.js"></script>
    <script>
        document.write('<script src="/asset/js/dist/blocks/albani-sermons.' + fixtureLang + '.min.js"><\/script>');
    </script>
</body>
</html>

        <h3 class="iwac-vis-pipeline__title" id="pipeline-1-title">Comment la modélisation thématique repère des thèmes dans les articles</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">IWAC entraîne un modèle thématique statistique, l’allocation de Dirichlet latente (LDA), sur le texte de ses articles de presse. On n’indique jamais au modèle quels sont les thèmes : il repère des groupes de mots qui tendent à apparaître dans les mêmes articles.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Articles</p>
                    <p class="iwac-vis-pipeline__caption">Le point de départ est le texte OCR de chaque article de presse en français.</p>
                    <p class="iwac-vis-pipeline__note">Les publications islamiques et les références scientifiques ont leurs propres modèles.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Préparation du texte</p>
                    <p class="iwac-vis-pipeline__caption">Les mots sont ramenés à leur forme de dictionnaire et les mots très courants sont retirés.</p>
                    <p class="iwac-vis-pipeline__note">Les noms de lieux et d’autres termes qui domineraient tous les thèmes sont mis de côté ; les paires de mots fréquentes, comme al_azhar, restent liées.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Comptage des mots</p>
                    <p class="iwac-vis-pipeline__caption">Chaque article devient le décompte des mots qu’il emploie ; l’ordre des mots est abandonné.</p>
                    <p class="iwac-vis-pipeline__note">Les mots présents dans très peu d’articles, ou dans une grande part d’entre eux, sont écartés.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Découverte des thèmes</p>
                    <p class="iwac-vis-pipeline__caption">La LDA infère 30 thèmes, chacun étant une liste de mots pondérés selon leur appartenance au thème.</p>
                    <p class="iwac-vis-pipeline__note">L’intitulé d’un thème se compose simplement de ses mots les plus caractéristiques.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Mélanges de thèmes</p>
                    <p class="iwac-vis-pipeline__caption">Chaque article reçoit une part de plusieurs thèmes ; IWAC conserve son thème principal et ses trois thèmes les plus forts.</p>
                    <p class="iwac-vis-pipeline__note">L’explorateur de thèmes suit chaque thème selon les années, les pays et les journaux.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">Les thèmes sont des régularités déduites des mots qui apparaissent ensemble, et non des sujets attribués par un catalogueur. Ils demandent une interprétation : lisez les articles qui composent un thème avant de le nommer, et gardez à l’esprit que la plupart des articles combinent plusieurs thèmes.</p>
        <p class="iwac-vis-pipeline__example">Exemple illustratif : les mots et les proportions des dessins sont inventés pour montrer la méthode et ne proviennent pas du modèle d’IWAC.</p>
    </figcaption>

    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-2-title">Comment l’IA transforme des pages numérisées en texte consultable</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">IWAC emprunte l’une de deux voies, selon ce dont dispose déjà un document. Les nouvelles numérisations sont confiées à un modèle multimodal qui lit lui-même l’image de la page ; un texte bruité issu d’un OCR classique peut plutôt être corrigé. Un document suit une seule voie, pas les deux.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route" aria-labelledby="pipeline-2-extraction">
            <h4 class="iwac-vis-pipeline__route-title" id="pipeline-2-extraction">Extraction directe, la chaîne actuelle</h4>
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Page numérisée</p>
                    <p class="iwac-vis-pipeline__caption">Le PDF du document est confié à un modèle multimodal : Gemini le lit page par page, Mistral Document AI en une seule requête.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Ordre de lecture</p>
                    <p class="iwac-vis-pipeline__caption">Les consignes fixent l’ordre : les colonnes principales de gauche à droite et de haut en bas, puis les titres, légendes et encadrés.</p>
                    <p class="iwac-vis-pipeline__note">Le modèle lit la mise en page et le texte d’un seul passage ; les étapes sont séparées ici pour le dessin.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Transcription</p>
                    <p class="iwac-vis-pipeline__caption">Le modèle écrit le texte, en raccordant les lignes et les mots coupés par les colonnes, et conserve la formulation de la source.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Texte assemblé</p>
                    <p class="iwac-vis-pipeline__caption">Les pages sont réunies avec des repères de page puis, après un aperçu, enregistrées dans la notice avec le nom du modèle.</p>
                    <p class="iwac-vis-pipeline__note">La numérisation reste à côté du texte : une mise en page inhabituelle peut encore sortir dans le mauvais ordre.</p>
                </li>
            </ol>
        </section>
        <section class="iwac-vis-pipeline__route" aria-labelledby="pipeline-2-correction">
            <h4 class="iwac-vis-pipeline__route-title" id="pipeline-2-correction">Post-correction d’un OCR bruité</h4>
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Texte OCR bruité</p>
                    <p class="iwac-vis-pipeline__caption">Un texte issu d’un OCR classique, avec ses caractères mal lus, ses mots coupés et ses erreurs d’encodage.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Sections</p>
                    <p class="iwac-vis-pipeline__caption">Un texte très long est découpé en sections que le modèle peut corriger en une requête.</p>
                    <p class="iwac-vis-pipeline__note">Le contexte peut se perdre d’une section à l’autre.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Correction par IA</p>
                    <p class="iwac-vis-pipeline__caption">Un modèle de langage corrige les erreurs de reconnaissance et rétablit les accents, sans traduire ni moderniser le texte.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Texte corrigé</p>
                    <p class="iwac-vis-pipeline__caption">La version corrigée devient le texte intégral consultable ; l’OCR d’origine est conservé pour comparaison.</p>
                    <p class="iwac-vis-pipeline__note">Les noms et graphies historiques sont conservés tels qu’imprimés.</p>
                </li>
            </ol>
        </section>
    </div>

        <p class="iwac-vis-pipeline__example">Exemple illustratif : la page et ses erreurs de lecture sont inventées pour montrer la méthode.</p>

    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-3-title">Comment les noms cités dans les articles deviennent des liens vers des notices d’autorité</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">Un modèle d’IA lit chaque article de presse et relève les personnes, organisations, lieux et sujets qu’il mentionne. Un nom n’est qu’une mention tant qu’il n’est pas rapproché des fichiers d’autorité d’IWAC, qui réunissent les variantes orthographiques sous une même notice.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Extraction et normalisation</p>
                    <p class="iwac-vis-pipeline__caption">Le modèle relève les noms qu’il trouve, sans titres comme El Hadj et avec les sigles écrits en toutes lettres.</p>
                    <p class="iwac-vis-pipeline__note">Les sujets sont choisis dans le vocabulaire propre à IWAC.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Réconciliation</p>
                    <p class="iwac-vis-pipeline__caption">Chaque nom est comparé aux notices d’autorité et à leurs formes alternatives : les correspondances exactes sont retenues, les graphies proches seulement suggérées.</p>
                    <p class="iwac-vis-pipeline__note">Un nom qui correspond à plusieurs notices est mis de côté plutôt que deviné.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Vérification</p>
                    <p class="iwac-vis-pipeline__caption">Un chercheur ou une chercheuse examine les noms ambigus, les graphies proches et les entités inconnues, puis accepte, corrige ou rejette chaque proposition.</p>
                    <p class="iwac-vis-pipeline__note">Un nom sans notice attend une nouvelle notice d’autorité, créée après examen.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Liaison</p>
                    <p class="iwac-vis-pipeline__caption">Les correspondances confirmées sont ajoutées à l’article sous forme de liens : les lieux dans Couverture spatiale, tout le reste dans Sujet.</p>
                    <p class="iwac-vis-pipeline__note">Chaque lien garde la trace du modèle qui l’a proposé ; une mise à jour ne fait qu’ajouter des liens, après une sauvegarde.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">Un nom surligné est une mention, pas encore un lien. Un modèle peut manquer un nom ou le rapprocher de la mauvaise notice, et les changements de nom et scissions des organisations demandent une connaissance historique : les correspondances incertaines sont donc vérifiées et chaque mise à jour peut être annulée.</p>
        <p class="iwac-vis-pipeline__example">Exemple illustratif : les variantes du nom sont celles d’une personne réelle de l’index d’IWAC ; la phrase qui les entoure est inventée.</p>

<figure class="iwac-vis-pipeline__figure" data-preset="albani-sermons" aria-labelledby="pipeline-4-title">
    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-4-title">Comment les sermons d’Albani Zaria deviennent des chiffres</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">L’exposition consacrée à Albani Zaria compte des mots, des termes et des noms dans les sermons et leçons transcrits du cheikh Muhammad Auwal Albani Zaria. Chaque chiffre renvoie à un passage, et chaque passage à son enregistrement.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Enregistrements et transcriptions</p>
                    <p class="iwac-vis-pipeline__caption">La reconnaissance vocale transcrit chaque enregistrement mot à mot, par segments de 20 minutes, et estime qui parle.</p>
                    <p class="iwac-vis-pipeline__note">Les deux peuvent se tromper : chaque passage renvoie donc à l’enregistrement.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Compter les mots</p>
                    <p class="iwac-vis-pipeline__caption">Les graphies avec et sans les lettres crochetées (ɓ, ɗ, ƙ, ƴ) comptent pour un seul mot, et les mots les plus courants sont écartés.</p>
                    <p class="iwac-vis-pipeline__note">Les mots vides sont ceux publiés par Bashir, Bichi et Adamu (2024) ; une règle simple distingue les passages en arabe du haoussa.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Les termes et leurs voisins</p>
                    <p class="iwac-vis-pipeline__caption">Les termes désignant la jeunesse et la politique sont repérés dans le texte, avec les mots qui apparaissent anormalement souvent à proximité.</p>
                    <p class="iwac-vis-pipeline__note">Les listes de mots sont une ébauche qu’un ou une spécialiste du haoussa vérifiera.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Personnes et lieux</p>
                    <p class="iwac-vis-pipeline__caption">Un modèle de reconnaissance d’entités nommées a proposé des noms une seule fois ; seule une liste de noms et de graphies établie à la main est comptée.</p>
                    <p class="iwac-vis-pipeline__note">Une graphie qui a un autre sens, comme shehu, est écartée : les décomptes sont donc des minimums.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Chiffres et passages</p>
                    <p class="iwac-vis-pipeline__caption">Les décomptes deviennent les graphiques et les cartes de la page ; les passages ne sont cités que depuis des transcriptions publiques.</p>
                    <p class="iwac-vis-pipeline__note">Un décompte indique où regarder ; le passage et l’enregistrement constituent la preuve.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">Les chiffres ne décrivent que ces enregistrements : un seul prédicateur, la part de son enseignement transcrite à ce jour, et les erreurs que contient la transcription. Les listes de mots et les traductions sont des ébauches qui attendent l’examen d’un ou d’une spécialiste.</p>
        <p class="iwac-vis-pipeline__example">Exemple illustratif : les dessins montrent la méthode avec des mots cités dans la section méthodologique de l’exposition ; les passages sont des traits, pas des citations.</p>
    </figcaption>

<figure class="iwac-vis-pipeline__figure" data-preset="issue-contents" aria-labelledby="pipeline-5-title">
    <div class="iwac-vis-pipeline__head">
        <h3 class="iwac-vis-pipeline__title" id="pipeline-5-title">Comment un numéro de magazine islamique reçoit sa table des matières</h3>
    </div>
    <p class="iwac-vis-pipeline__lede">Les magazines islamiques numérisés n’étaient d’abord consultables que numéro par numéro. Un modèle d’IA lit chaque numéro page par page, suit chaque article sur les pages qu’il occupe et rédige une table des matières qui rend chaque article repérable à lui seul.</p>
    <div class="iwac-vis-pipeline__routes">
        <section class="iwac-vis-pipeline__route">
            <ol class="iwac-vis-pipeline__stages">
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Numéro</p>
                    <p class="iwac-vis-pipeline__caption">Chaque numéro numérisé est découpé en pages, et chaque page est confiée séparément à un modèle de vision : Gemini, Claude ou Mistral OCR.</p>
                    <p class="iwac-vis-pipeline__note">Le numéro lui-même reste entier dans la collection.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Les articles de chaque page</p>
                    <p class="iwac-vis-pipeline__caption">Le modèle relève chaque article de la page : son titre tel qu’imprimé, avec sa rubrique entre crochets, ses auteurs et un bref résumé de ce que montre la page.</p>
                    <p class="iwac-vis-pipeline__note">Couvertures, publicités et brèves sont écartées ; les termes arabes bien lus sont conservés.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Suites</p>
                    <p class="iwac-vis-pipeline__caption">Les mentions comme « suite page 7 » ou « à suivre » sont relevées, pour retrouver les parties d’un article imprimées séparément.</p>
                    <p class="iwac-vis-pipeline__note">Un article qui se termine sur une page ultérieure y est aussi relevé, sous son titre ou comme suite.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Consolidation</p>
                    <p class="iwac-vis-pipeline__caption">Un second passage fusionne les parties de chaque article, réunit ses pages et ses auteurs, et rédige un seul résumé de quatre à six phrases.</p>
                    <p class="iwac-vis-pipeline__note">Les parties sont rapprochées par le titre, les mentions de suite et le sujet ; une longue série en plusieurs parties peut être mal fusionnée.</p>
                </li>
                <li class="iwac-vis-pipeline__stage">
                    <p class="iwac-vis-pipeline__name">Table des matières</p>
                    <p class="iwac-vis-pipeline__caption">L’index est enregistré dans le champ Table des matières du numéro : une entrée par article, avec ses pages, son titre, ses auteurs et son résumé.</p>
                    <p class="iwac-vis-pipeline__note">Le modèle qui l’a rédigé est consigné avec le champ ; la mise à jour ne touche à rien d’autre, après une sauvegarde et une confirmation.</p>
                </li>
            </ol>
        </section>
    </div>
    <figcaption class="iwac-vis-pipeline__foot">
        <p class="iwac-vis-pipeline__caveat">Une table des matières lue par un modèle guide le lecteur dans le numéro ; ce n’est pas une notice de catalogue. Une mise en page inhabituelle peut masquer un article ou faire passer une publicité pour un article, un titre décoratif peut être pris pour un titre, et chaque résumé est sélectif : lisez les pages avant de citer un article.</p>
        <p class="iwac-vis-pipeline__example">Exemple illustratif : le numéro, ses titres et ses pages sont inventés pour montrer la méthode.</p>
    </figcaption>
</figure>

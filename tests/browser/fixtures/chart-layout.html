<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IWAC real ECharts layout fixture</title>
    <link rel="stylesheet" href="/asset/css/iwac-core.min.css">
    <link rel="stylesheet" href="/asset/css/blocks/article-dashboard.min.css">
    <link rel="stylesheet" href="/asset/css/blocks/scary-terms.min.css">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        #host { width: 100%; height: 400px; }
        #accessible-data { position: relative; min-height: 3rem; }
        body { background: var(--panel-bg); color: var(--ink); }
        .samples { position: relative; height: 100px; margin: 1rem; }
        .iwac-vis-article-card__shared { right: 120px; }
        .iwac-vis-scary-slider { width: 100%; margin: 0; }
    </style>
</head>
<body>
    <div id="host"></div>
    <div id="accessible-data"></div>
    <div class="samples">
        <span class="iwac-vis-article-card__sim">92 %</span>
        <span class="iwac-vis-article-card__shared">12 shared entities</span>
    </div>
    <label for="year">Year</label>
    <input id="year" class="iwac-vis-scary-slider" type="range" min="1980" max="2020" value="2000">
    <!-- Test-only npm dependency: no CDN request and no production hosting change. -->
    <script src="/node_modules/echarts/dist/echarts.min.js"></script>
    <script src="/asset/js/dist/shared-core.min.js"></script>
    <script src="/asset/js/dist/shared-charts.min.js"></script>
    <script>
        window.themeReady = fetch('/tokens.json').then(function (response) { return response.json(); }).then(function (tokens) {
            var theme = new URLSearchParams(location.search).get('theme') || 'light';
            document.body.dataset.theme = theme;
            Object.keys(tokens[theme]).forEach(function (key) { document.body.style.setProperty(key, tokens[theme][key]); });
            document.body.style.setProperty('--panel-bg', tokens[theme]['--surface-raised']);
            // Register the token-backed theme before the first chart. The
            // asynchronous theme observer otherwise races the baseline image.
            IWACVis.refreshThemes();
        });
        window.drawChart = async function (kind, count) {
            await window.themeReady;
            var C = IWACVis.chartOptions;
            var years = Array.from({ length: count }, function (_, i) { return 1980 + i; });
            var counts = years.map(function (_, i) { return 12000 + i * 300; });
            var option;
            if (kind === 'gantt') {
                option = C.gantt(years.map(function (year, i) {
                    return { name: 'Entity ' + i, country: 'Togo', year_min: year, year_max: 2026, total: count - i };
                }));
            } else if (kind === 'chord') {
                option = C.chord({ names: ['Islam', 'Education', 'Associations'], matrix: [[0, 12, 5], [12, 0, 8], [5, 8, 0]] });
            } else if (kind === 'growth') {
                option = C.growthBar({
                    months: years.map(function (y) { return y + '-01'; }),
                    monthly_additions: counts,
                    cumulative_total: counts.map(function (v, i) { return v * (i + 1); })
                });
            } else if (kind === 'stacked') {
                var colors = C.polarityPalette();
                var keys = Object.keys(colors);
                var series = {};
                keys.forEach(function (key, i) { series[key] = counts.map(function (v) { return Math.round(v / (i + 1)); }); });
                option = C.stackedBar({ categories: years, stackKeys: keys,
                    series: series }, { categoryName: 'Year', colors: colors });
            } else {
                option = C.timeline({ years: years, countries: ['Togo', 'Niger'],
                    series: { Togo: counts, Niger: counts } });
            }
            window.chart = IWACVis.registerChart(document.getElementById('host'), function (el, instance) {
                window.drawCount = (window.drawCount || 0) + 1;
                instance.setOption(option, true);
            }, { renderer: 'svg' });
            IWACVis.panels.addTableButtons(document.getElementById('accessible-data'), document.getElementById('host'));
            await document.fonts.ready;
            await new Promise(function (resolve) { requestAnimationFrame(resolve); });
        };
        window.chartLayout = function () {
            var option = window.chart.getOption();
            return {
                grid: window.chart.getModel().getComponent('grid').coordinateSystem.getRect(),
                labels: Array.from(document.querySelectorAll('#host svg text')).map(function (node) {
                    var r = node.getBoundingClientRect();
                    return { text: node.textContent, x: r.x, y: r.y, width: r.width, height: r.height };
                }),
                zoom: option.dataZoom.map(function (zoom) { return { bottom: zoom.bottom, height: zoom.height }; })
            };
        };
        var preview = new URLSearchParams(location.search).get('preview');
        if (preview) window.drawChart(preview, 45);
    </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IWAC Sentiment Atlas fixture</title>
    <script>
        const fixtureParams = new URLSearchParams(location.search);
        const fixtureLang = /^fr/i.test(fixtureParams.get('lang') || '') ? 'fr' : 'en';
        document.documentElement.lang = fixtureLang;
    </script>
    <!-- The block declares no sheet of its own (BlockRegistry: no blockCss). -->
    <link rel="stylesheet" href="/asset/css/iwac-core.min.css">
    <style>
        main { max-width: 1180px; margin: 0 auto; }
    </style>
</head>
<body>
    <script src="/tests/browser/fixtures/theme-stand-in.js"></script>
    <script>
        // The bundle comes from files/iwac-visualizations/sentiment-atlas.json;
        // serve tests/browser/fixtures/data/sentiment-atlas.json instead — a
        // 1,234-row synthetic sample aggregated with the rules of
        // generate_sentiment_atlas.py, so every stack sums to its model's
        // rated count and every agreement matrix to its co-rated count — and
        // refuse anything else.
        window.__fetched = [];
        (function () {
            const realFetch = window.fetch.bind(window);
            window.fetch = function (url, init) {
                const u = String(url);
                window.__fetched.push(u);
                const m = /\/files\/iwac-visualizations\/([^?]+)/.exec(u);
                if (m) return realFetch('/tests/browser/fixtures/data/' + m[1], init);
                return Promise.reject(new Error('unexpected fetch: ' + u));
            };
        })();
    </script>
    <main>
        <h1>Sentiment Atlas</h1>
        <!-- What block-layout/_generic.phtml renders for the registry row:
             the shell with its embed opt-in and the loading slot. The page's
             own heading above stands in for the Omeka page title. -->
        <div class="iwac-vis-block iwac-vis-sentiment-atlas"
             data-base-path=""
             data-site-base="/s/iwac"
             data-embed-slug="sentiment-atlas"
             data-embed-base="/s/iwac">
            <div class="iwac-vis-loading" role="status" aria-live="polite">
                <div class="iwac-vis-spinner" aria-hidden="true"></div>
                <span>Loading sentiment atlas&hellip;</span>
            </div>
        </div>
    </main>
    <!-- ECharts from the test-only npm copy (the version iwac-assets.phtml
         pins; chart-layout.spec.js asserts it), then the bundles in
         Site\AssetPlan::bundles() order for chartOptions + facetButtons.
         shared-core and the block bundle are built per locale. -->
    <script src="/node_modules/echarts/dist/echarts.min.js"></script>
    <script>
        document.write('<script src="/asset/js/dist/shared-core.' + fixtureLang + '.min.js"><\/script>');
    </script>
    <script src="/asset/js/dist/shared-charts.min.js"></script>
    <script src="/asset/js/dist/shared-ui.min.js"></script>
    <script>
        document.write('<script src="/asset/js/dist/blocks/sentiment-atlas.' + fixtureLang + '.min.js"><\/script>');
    </script>
</body>
</html>

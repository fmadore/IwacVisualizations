name: Lighthouse budgets

# Every block page is loaded by Lighthouse — mobile, simulated slow 4G, its
# defaults — three times, from the same browser fixtures the Playwright suite
# drives (tests/browser/fixtures/<block>.html, served gzipped by
# tests/browser/server.js the way the live site serves them). The median run
# is held against tests/lighthouse/baseline.json by scripts/check-lighthouse.js:
#
#   - script / stylesheet / image / font transfer bytes and the request count
#     may grow by at most 10% (deterministic: every run must load the same
#     bytes, or the page is reported as unstable);
#   - the accessibility and best-practices scores may not fall at all
#     (they repeat run to run on one host);
#   - the performance score may fall by at most the margin the script states,
#     measured from repeated runs on this runner, because it is timed on the
#     runner's CPU.
#
# SEO is not scored: a fixture's <head> is the harness's, and the theme and
# IWAC-SEO own it live. The fixtures stub the data and the theme, so this
# measures what the module ships, not the server, the CDN or the theme — those
# are the live site's to answer for, not a pull request's.
#
# A page that got 20% lighter, or whose accessibility or best-practices score
# rose, fails too, until the baseline is rewritten — the same self-retiring
# rule as the audit exceptions, so an improvement is locked in rather than
# left as headroom. Re-baseline with `npm run check:lighthouse -- --update`;
# the scores come from this job's `lighthouse` artifact (baseline.json), never
# from a laptop, whose CPU and fonts are not the runner's. The artifact also
# holds one HTML report per page, the median run's.
#
# TRIGGERS: build-check.yml's ignore-list, for the same reason — an allow-list
# fails open the day a new file starts to matter.

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**/*.py"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/laicite/**"
      - "scripts/*.json"
      - "tests/python/**"
      - "tests/php/**"
      - "tests/integration/**"
      - "ruff.toml"
      - "phpstan.neon.dist"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "DATA_NOTES.md"
      - "LAICITE_METHODOLOGY.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "scripts/**/*.py"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/laicite/**"
      - "scripts/*.json"
      - "tests/python/**"
      - "tests/php/**"
      - "tests/integration/**"
      - "ruff.toml"
      - "phpstan.neon.dist"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "DATA_NOTES.md"
      - "LAICITE_METHODOLOGY.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned build tooling
        run: npm ci

      # The Chromium @playwright/test pins, not the runner's own Chrome, so a
      # runner image update cannot move the scores under an unchanged tree.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lighthouse budgets, median of three runs per block page
        run: npm run check:lighthouse

      - name: Keep the reports and the measured baseline
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: test-results/lighthouse/
          retention-days: 14
          if-no-files-found: ignore

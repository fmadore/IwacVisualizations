name: Build check (JS/CSS)

# The repo commits both sources and their built form (asset/js/dist/
# bundles, .min.css siblings), and the lint gates run only locally by
# convention — so a forgotten `npm run build` (stale bundles) or a token
# violation used to reach main unnoticed. This check rebuilds everything and
# fails when the committed built assets don't match the sources, or when any
# gate in `npm run lint` (eslint, theme tokens, block registry ↔ manifest,
# MapLibre gates, i18n, versions) reports a problem — they run first inside
# `npm run build`.
#
# Deliberately narrow triggers: data regeneration has its own workflow
# (regenerate-data.yml); Python/PHP-only pushes don't need a node build.
#
# `language/**` is in scope because the same `npm run build` runs the .po/.mo
# guard, and a fr.po edit that forgets to recompile fr.mo touches nothing else
# — that drift shipped once already (v1.48.1) with no CI path that could see
# it.

on:
  push:
    branches: [main]
    paths:
      - "asset/**"
      - "language/**"
      # view/ + src/ + the two config files: `npm run build` runs lint:theme
      # (which scans <style> blocks in view/) and lint:blocks (registry ↔
      # config ↔ classes ↔ templates). Without these paths a view-only or
      # src-only PR skipped both and lint.yml never ran the npm gates.
      - "view/**"
      - "src/**"
      - "Module.php"
      - "config/module.config.php"
      - "scripts/build-js.js"
      - "scripts/build-css.js"
      - "eslint.config.js"
      - "scripts/build-mo.js"
      - "scripts/check-*.js"
      - "scripts/gettext.js"
      - "tests/js/**"
      - "tests/browser/**"
      - "playwright.config.js"
      - "config/module.ini"
      - "tokens.json"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "asset/**"
      - "language/**"
      # view/ + src/ + the two config files: `npm run build` runs lint:theme
      # (which scans <style> blocks in view/) and lint:blocks (registry ↔
      # config ↔ classes ↔ templates). Without these paths a view-only or
      # src-only PR skipped both and lint.yml never ran the npm gates.
      - "view/**"
      - "src/**"
      - "Module.php"
      - "config/module.config.php"
      - "scripts/build-js.js"
      - "scripts/build-css.js"
      - "eslint.config.js"
      - "scripts/build-mo.js"
      - "scripts/check-*.js"
      - "scripts/gettext.js"
      - "tests/js/**"
      - "tests/browser/**"
      - "playwright.config.js"
      - "config/module.ini"
      - "tokens.json"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned build tooling
        run: npm ci

      - name: JavaScript behavioral contracts
        run: npm test

      - name: Install Chromium for responsive browser contracts
        run: npx playwright install --with-deps chromium

      - name: Browser rendering and embed contracts
        run: npm run test:browser

      # `retries: 2` keeps a lost frame from blocking a release; this keeps
      # a test that only passes on retry from hiding as a green run.
      - name: Browser contracts must pass first time
        run: node scripts/check-flakes.js test-results/report.json

      - name: Token guard + rebuild minified assets
        run: npm run build

      - name: Committed .min files must match the sources
        run: |
          if ! git diff --exit-code; then
            echo "::error::Built assets are stale — run 'npm run build' and commit asset/js/dist and the .min.css siblings."
            exit 1
          fi

name: Build check (JS/CSS)

# The repo commits both sources and their built form (asset/js/dist/
# bundles, .min.css siblings), and the lint gates run only locally by
# convention — so a forgotten `npm run build` (stale bundles) or a token
# violation used to reach main unnoticed. This check rebuilds everything and
# fails when the committed built assets don't match the sources, or when any
# gate in `npm run lint` (eslint, theme tokens, block registry ↔ manifest,
# MapLibre gates, i18n, versions) reports a problem — they run first inside
# `npm run build`.
#
# TRIGGERS: everything except what provably cannot change a Node gate.
# This used to be an allow-list of paths, and an allow-list fails open: it
# omitted scripts/theme-token-guard.cjs, scripts/i18n-strip.js,
# scripts/cdn-integrity.js and this file itself, so d7289889 — a commit that
# changed only the guard engine — ran nothing at all. The ignore-list below
# names only the generators' Python, their tests and lock, and prose no gate
# reads; a new script or config file is covered the day it lands.
#
# It is also a reusable workflow (`workflow_call`): release.yml runs it on the
# tagged tree and publishes nothing unless it passes. A reusable call ignores
# the path filters, so the whole suite runs there.

on:
  push:
    branches: [main]
    paths-ignore:
      - "scripts/**/*.py"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/laicite/**"
      - "scripts/*.json"
      - "tests/python/**"
      - "tests/php/**"
      - "tests/integration/**"
      - "ruff.toml"
      - "phpstan.neon.dist"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "DATA_NOTES.md"
      - "LAICITE_METHODOLOGY.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "scripts/**/*.py"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/laicite/**"
      - "scripts/*.json"
      - "tests/python/**"
      - "tests/php/**"
      - "tests/integration/**"
      - "ruff.toml"
      - "phpstan.neon.dist"
      - "CHANGELOG.md"
      - "ROADMAP.md"
      - "DATA_NOTES.md"
      - "LAICITE_METHODOLOGY.md"
      - "docs/**"
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to check out; empty for the event's own ref.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # In a reusable call `github.workflow` is the CALLER's name, so a release's
  # gate never shares a group with (and never cancels) a push-triggered run.
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned build tooling
        run: npm ci

      # npm audit at high and above, minus the written exceptions in
      # scripts/lib/audit-exceptions.js (X-07). Every dependency here is a dev
      # dependency, so `--omit=dev` or a lower `--audit-level` would switch
      # the gate off rather than narrow it.
      - name: npm audit, minus the written exceptions
        run: npm run check:audit

      - name: JavaScript behavioral contracts
        run: npm test

      - name: Install Chromium for responsive browser contracts
        run: npx playwright install --with-deps chromium

      - name: Browser rendering and embed contracts
        run: npm run test:browser

      # `retries: 2` keeps a lost frame from blocking a release; this keeps
      # a test that only passes on retry from hiding as a green run.
      - name: Browser contracts must pass first time
        run: node scripts/check-flakes.js test-results/report.json

      - name: Token guard + rebuild minified assets
        run: npm run build

      # `git diff --exit-code` sees only TRACKED files, so a new block sheet
      # whose .min.css sibling was never committed passed here and 404'd in
      # production. `git status` with untracked files sees both; test-results/
      # and the other run outputs are gitignored.
      - name: Committed built files must match the sources, none missing
        run: |
          changes=$(git status --porcelain --untracked-files=all)
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff --stat
            echo "::error::Built assets are stale or missing — run 'npm run build' and commit asset/js/dist, the .min.css siblings and any new output."
            exit 1
          fi

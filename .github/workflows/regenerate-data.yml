name: Regenerate visualization data

# Heavy Python precompute (UMAP / ForceAtlas2 / numpy kNN over the Hugging Face
# dataset) runs HERE — never on the production Omeka server, which stays a plain
# PHP box. Immutable archive releases are selected by data/latest.json;
# the admin import verifies them and activates a content-addressed generation.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Optional tag for an immutable, versioned snapshot release. Leave blank
          to update the moving `data` release that the Sync Data job pulls by default.
        required: false
        default: ""
  # Auto-rebuild when a GENERATOR INPUT changes — the only kind of push that
  # changes the data output. Deliberately NOT triggered on every push: PHP/JS/CSS/
  # docs/version-bump commits produce identical data, and a 30-min HF-downloading
  # build on each of those would be pure waste. (`scripts/**/*.py` covers the
  # generators + iwac_utils + dashboard_aggregator; .js build scripts / README are
  # excluded by the .py filter.)
  #
  # The code is not the only committed input. The generators also read curated
  # JSON sidecars (the laïcité lexicon and audit ledger, the org co-occurrence
  # targets), the static geometry under asset/geo/, and ship the two
  # hand-curated event files straight into the archive. A push that changed
  # only one of those used to rebuild nothing: e3130cef edited the lexicon and
  # the published laïcité bundles kept counting with the old one.
  push:
    branches: [main]
    paths:
      - "config/sentiment-models.json"
      - "config/timelines.json"
      - ".github/workflows/regenerate-data.yml"
      - "scripts/**/*.py"
      - "scripts/*.json"
      - "scripts/laicite/*.json"
      - "asset/data/scary-terms-events.json"
      - "asset/data/laicite-events.json"
      - "asset/geo/**"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/python-lock.js"
  # The other driver of data changes is the HF dataset itself (refreshed roughly
  # monthly), which leaves no signal in this repo — so rebuild on a schedule too.
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month

# Read-only by default. Only the publish job, which runs no third-party code,
# holds `contents: write` (X-09): the generators, pip and npm run in a job
# whose token cannot create a release or push a tag.
permissions:
  contents: read

# Never let two data builds publish to the same release at once.
concurrency:
  group: regenerate-data
  cancel-in-progress: false

jobs:
  # The PHP/Python gate suite (lint.yml, called as a reusable workflow) on the
  # tree this run publishes from: ruff, the Python contracts, the validator's
  # self-test. It used to be two inline steps here; as a dependency of the
  # generate job it still fails in minutes, before the HF download and the
  # 30-minute run, and nothing can publish past it (X-06).
  gates:
    name: Gate — PHP and Python
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  regenerate:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Verify and install locked dependencies
        run: |
          node scripts/python-lock.js --check
          pip install --require-hashes -r scripts/requirements.lock

      # ruff and the Python contracts ran in the `gates` job above, on this
      # same tree — a push that only touches a sidecar never runs lint.yml on
      # its own, and the monthly schedule runs no other workflow at all.

      # The dataset revision keys the Hugging Face cache: a run against an
      # unchanged dataset restores every parquet file instead of downloading
      # all seven subsets again — until v1.59.0 every push to scripts/*.py and
      # every monthly run paid the full download. HF_TOKEN is needed here too:
      # the mirror is private and dataset_info() 401s without it. The revision
      # is read through iwac_utils so this step follows DATASET_ID wherever it
      # points.
      - name: Resolve the dataset revision
        id: hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sha=$(python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from huggingface_hub import HfApi
          from iwac_utils import DATASET_ID
          print(HfApi().dataset_info(DATASET_ID).sha)
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Dataset revision: $sha"

      # Exact key, no restore-keys: the datasets cache is laid out per
      # revision, so an older revision's files are dead weight to a newer one.
      - name: Cache the Hugging Face download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ steps.hf.outputs.sha }}

      # numba JIT-compiles umap-learn on every cold run; the four UMAP
      # generators each paid it. This one CAN restore an older key.
      - name: Cache the numba JIT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/numba
          key: numba-${{ runner.os }}-${{ hashFiles('scripts/requirements.lock') }}
          restore-keys: |
            numba-${{ runner.os }}-

      - name: Run generators
        # ONE interpreter for all 31 generators, via scripts/run_all.py. It
        # installs a FrameStore, so the seven Hugging Face subsets are
        # converted to pandas once each instead of ~90 times across 31 process
        # starts (Tier 8 / P1). The generator ORDER lives in run_all.GENERATORS
        # — it used to be a `gens=(…)` array here, where nothing could check it
        # against what is on disk; a Python test now does.
        #
        # Defaults already match the committed output shapes/minify. Static
        # geojson is read from asset/geo/ (present from checkout), as are the
        # hand-curated scary-terms-events.json (issue #2) and
        # laicite-events.json (issue #14), which ship in the archive from the
        # checkout rather than being generated. No --continue-on-error: the
        # runner stops on the first failure so a partial build is never
        # published.
        env:
          # The IWAC dataset moved to a PRIVATE full mirror
          # (fmadore/islam-west-africa-collection-full); `datasets` reads this
          # env var automatically. Fine-grained read-only token scoped to that
          # one dataset repo.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REVISION: ${{ steps.hf.outputs.sha }}
        run: |
          set -euo pipefail
          export NUMBA_CACHE_DIR="$HOME/.cache/numba"
          export IWAC_DATASET_REVISION="$HF_REVISION"
          python scripts/run_all.py --strict

      # A 90-minute job that fails leaves nothing behind but a red tick in a
      # tab nobody has open. The step summary is what a maintainer actually
      # reads, and `if: failure()` is the only way it gets written on the run
      # that matters. run_all already logs a per-generator duration.
      - name: Report a failed build
        if: failure()
        run: |
          {
            echo "## Data regeneration failed"
            echo
            echo "The generators did not complete, so **nothing was published**"
            echo "and the \`data\` release still holds the previous archive."
            echo
            echo "Open the *Run generators* step above: \`run_all.py\` groups its"
            echo "output per generator and prints how long each took, so the last"
            echo "\`::group::\` line names the one that stopped."
          } >> "$GITHUB_STEP_SUMMARY"

      # Check required files, payload contracts, output receipts and source
      # references before writing the per-file integrity manifest.
      - name: Write verified data manifest
        env:
          IWAC_DATASET_REVISION: ${{ steps.hf.outputs.sha }}
        run: python scripts/validate_data.py --write-manifest

      - name: Package archive
        # Entries land at the zip ROOT (e.g. collection-overview.json,
        # compare-newspapers/index.json) — the Sync Data job extracts the tree
        # straight into files/iwac-visualizations/ and looks for that root marker.
        run: |
          set -euo pipefail
          # The preceding manifest step checks the complete publication contract.
          ( cd asset/data && zip -r -q -X "$GITHUB_WORKSPACE/iwac-data.zip" . )
          # The digest the Sync Data job verifies before it installs anything
          # (SyncData::verifyDigest). Published beside the archive under the
          # same name + .sha256; `sha256sum -c` format, so it is checkable by
          # hand too.
          sha256sum iwac-data.zip > iwac-data.zip.sha256
          cat iwac-data.zip.sha256
          echo "Archive size:"; ls -lh iwac-data.zip
          echo "Entry count:"; unzip -l iwac-data.zip | tail -1

      # The archive leaves this job as an artifact; the job that can write a
      # release never runs the generators, pip or npm.
      - name: Hand the archive to the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iwac-data
          path: |
            iwac-data.zip
            iwac-data.zip.sha256
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish the archive
    needs: [gates, regenerate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # `gh release create` / `gh release upload`
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iwac-data

      # The digest travels with the archive; check it survived the hand-off.
      - name: Verify the archive digest
        run: sha256sum -c iwac-data.zip.sha256

      - name: Publish immutable release and activate pointer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          RUN_TAG: data-build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh release create "$RUN_TAG" iwac-data.zip iwac-data.zip.sha256 \
            --title "Precomputed data $RUN_TAG" --notes "Generated from $GITHUB_SHA" --latest=false
          # A versioned override is immutable too: existing tags fail, never clobber.
          if [ -n "$REQUESTED_TAG" ]; then
            gh release create "$REQUESTED_TAG" iwac-data.zip iwac-data.zip.sha256 \
              --title "Precomputed data $REQUESTED_TAG" --notes "Generated from $GITHUB_SHA" --latest=false
          else
            gh release view data >/dev/null 2>&1 || gh release create data \
              --title "Latest precomputed data" --notes "Pointer to an immutable build." --latest=false
            printf '{"tag": "%s"}' "$RUN_TAG" > latest.json
            gh release upload data latest.json --clobber
          fi

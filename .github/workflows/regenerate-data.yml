name: Regenerate visualization data

# Heavy Python precompute (UMAP / ForceAtlas2 / numpy kNN over the Hugging Face
# dataset) runs HERE — never on the production Omeka server, which stays a plain
# PHP box. The output is published as a single ZIP on the moving `data` release;
# the module's "Pull latest data" admin Job downloads it and unpacks it into
# files/iwac-visualizations/. See issue #7.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Optional tag for an immutable, versioned snapshot release. Leave blank
          to update the moving `data` release that the Sync Data job pulls by default.
        required: false
        default: ""
  # Auto-rebuild when the GENERATOR CODE changes — the only kind of push that
  # changes the data output. Deliberately NOT triggered on every push: PHP/JS/CSS/
  # docs/version-bump commits produce identical data, and a 30-min HF-downloading
  # build on each of those would be pure waste. (`scripts/*.py` covers the
  # generators + iwac_utils + dashboard_aggregator; .js build scripts / README are
  # excluded by the .py filter.)
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/python-lock.js"
  # The other driver of data changes is the HF dataset itself (refreshed roughly
  # monthly), which leaves no signal in this repo — so rebuild on a schedule too.
  schedule:
    - cron: "0 4 1 * *"   # 04:00 UTC on the 1st of each month

permissions:
  contents: write   # required for `gh release create` / `gh release upload`

# Never let two data builds publish to the same release at once.
concurrency:
  group: regenerate-data
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.lock

      - name: Verify and install locked dependencies
        run: |
          node scripts/python-lock.js --check
          pip install --require-hashes -r scripts/requirements.lock

      # The dataset revision keys the Hugging Face cache: a run against an
      # unchanged dataset restores every parquet file instead of downloading
      # all seven subsets again — until v1.59.0 every push to scripts/*.py and
      # every monthly run paid the full download. HF_TOKEN is needed here too:
      # the mirror is private and dataset_info() 401s without it. The revision
      # is read through iwac_utils so this step follows DATASET_ID wherever it
      # points.
      - name: Resolve the dataset revision
        id: hf
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          sha=$(python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from huggingface_hub import HfApi
          from iwac_utils import DATASET_ID
          print(HfApi().dataset_info(DATASET_ID).sha)
          PY
          )
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Dataset revision: $sha"

      # Exact key, no restore-keys: the datasets cache is laid out per
      # revision, so an older revision's files are dead weight to a newer one.
      - name: Cache the Hugging Face download
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ steps.hf.outputs.sha }}

      # numba JIT-compiles umap-learn on every cold run; the four UMAP
      # generators each paid it. This one CAN restore an older key.
      - name: Cache the numba JIT cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/numba
          key: numba-${{ runner.os }}-${{ hashFiles('scripts/requirements.lock') }}
          restore-keys: |
            numba-${{ runner.os }}-

      - name: Run generators
        # The 30 HF-driven generators, with default flags (defaults already match
        # the committed output shapes/minify). Static geojson is read from
        # asset/geo/ (present from checkout), as are the hand-curated
        # scary-terms-events.json (issue #2) and laicite-events.json (issue #14),
        # which ship in the archive from the checkout rather than being generated.
        # Fail-fast so a partial build is never published.
        env:
          # The IWAC dataset moved to a PRIVATE full mirror
          # (fmadore/islam-west-africa-collection-full); `datasets` reads this
          # env var automatically. Fine-grained read-only token scoped to that
          # one dataset repo.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          export NUMBA_CACHE_DIR="$HOME/.cache/numba"
          gens=(
            audiovisual_overview
            collection_overview wordcloud world_map index_overview keyword_explorer
            entity_networks lexical_metrics on_this_day periodicals_overview periodicals_landscape
            press_bylines references_overview scary_terms semantic_landscape sentiment_atlas
            spatial_exploration template_summary topic_explorer compare_newspapers
            article_dashboards person_dashboards entity_dashboards publication_dashboards
            org_cooccurrence term_trends reprints corpus_health keyness
            reference_dashboards laicite
          )
          for g in "${gens[@]}"; do
            echo "::group::generate_${g}"
            python "scripts/generate_${g}.py"
            echo "::endgroup::"
          done

      - name: Write data manifest
        # Build-stamp the archive so the client can cache-bust on each data sync
        # (data refreshes no longer bump the module ?v=). The PHP job also records
        # its own last-sync time; this is the in-archive provenance record.
        run: |
          python - <<'PY'
          import datetime, json, os
          manifest = {
              "generatedAt": datetime.datetime.now(datetime.timezone.utc)
                  .strftime("%Y-%m-%dT%H:%M:%SZ"),
              "buildId":   (os.environ.get("GITHUB_SHA", "") or "")[:12],
              "runId":     os.environ.get("GITHUB_RUN_ID", ""),
              "runNumber": os.environ.get("GITHUB_RUN_NUMBER", ""),
          }
          with open("asset/data/manifest.json", "w", encoding="utf-8") as fh:
              json.dump(manifest, fh, ensure_ascii=False)
          print(manifest)
          PY

      - name: Package archive
        # Entries land at the zip ROOT (e.g. collection-overview.json,
        # compare-newspapers/index.json) — the Sync Data job extracts the tree
        # straight into files/iwac-visualizations/ and looks for that root marker.
        run: |
          set -euo pipefail
          # Every bundle the blocks fetch must exist and be non-empty before
          # anything is published. Until v1.59.0 only collection-overview.json
          # was checked, and one generator (wordcloud) could write an EMPTY
          # payload and exit 0 — a partial build must never reach the release.
          # Names are the generators' save_json targets; the two *-events
          # files are committed and ride in from the checkout.
          fail=0
          for f in \
            audiovisual-overview.json collection-map.json collection-overview.json \
            collection-wordcloud.json compare-newspapers/index.json corpus-health.json \
            entity-networks-global.json entity-networks-spatial.json index-overview.json \
            keyness.json keyword-explorer-metadata.json keyword-explorer-spatial.json \
            keyword-explorer-subjects.json \
            laicite-actors.json laicite-arenas.json laicite-bylines.json laicite-circulation.json \
            laicite-collocates.json laicite-concordance.json laicite-corpora.json \
            laicite-countries.json laicite-documents.json laicite-events.json laicite-implicit.json \
            laicite-metadata.json laicite-places.json laicite-references.json \
            laicite-seasonality.json laicite-semantic.json laicite-sentiment.json laicite-trends.json \
            lexical-metrics.json org-cooccurrence.json periodicals-landscape.json \
            periodicals-overview.json press-bylines.json press-reprints.json references-overview.json \
            scary-terms-cooccurrence.json scary-terms-countries.json scary-terms-events.json \
            scary-terms-global.json scary-terms-metadata.json scary-terms-places.json \
            scary-terms-temporal.json scary-terms-trends.json scary-terms-wordcloud.json \
            semantic-landscape.json sentiment-atlas.json spatial-exploration.json \
            template-summary.json term-trends-index.json topic-explorer.json
          do
            test -s "asset/data/$f" || { echo "::error::missing or empty output: asset/data/$f"; fail=1; }
          done
          for d in article-dashboards compare-newspapers entity-dashboards on-this-day \
                   person-dashboards publication-dashboards reference-dashboards term-trends
          do
            [ -n "$(ls -A "asset/data/$d" 2>/dev/null)" ] || { echo "::error::empty fan-out: asset/data/$d"; fail=1; }
          done
          [ "$fail" -eq 0 ] || exit 1
          ( cd asset/data && zip -r -q -X "$GITHUB_WORKSPACE/iwac-data.zip" . )
          # The digest the Sync Data job verifies before it installs anything
          # (SyncData::verifyDigest). Published beside the archive under the
          # same name + .sha256; `sha256sum -c` format, so it is checkable by
          # hand too.
          sha256sum iwac-data.zip > iwac-data.zip.sha256
          cat iwac-data.zip.sha256
          echo "Archive size:"; ls -lh iwac-data.zip
          echo "Entry count:"; unzip -l iwac-data.zip | tail -1

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ]; then
            # Immutable, versioned snapshot — pull it explicitly with the Job's `tag` arg.
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
              --title "Precomputed visualization data ($TAG)" \
              --notes "Automated data build from ${GITHUB_SHA:0:12} (run ${GITHUB_RUN_ID})." \
              --latest=false
            gh release upload "$TAG" iwac-data.zip iwac-data.zip.sha256 --clobber
          else
            # Moving `data` release — the stable URL the Sync Data job downloads by default:
            #   https://github.com/${{ github.repository }}/releases/download/data/iwac-data.zip
            gh release view data >/dev/null 2>&1 || gh release create data \
              --title "Precomputed visualization data (latest)" \
              --notes "Moving release: the latest automated data build, refreshed by the regenerate-data workflow." \
              --latest=false
            gh release upload data iwac-data.zip iwac-data.zip.sha256 --clobber
          fi
          echo "Published iwac-data.zip + iwac-data.zip.sha256 to release '${TAG:-data}'."

name: Lint (PHP/Python)

# build-check.yml covers the JS/CSS side (theme tokens, block registry, stale
# .min files). Nothing covered the PHP or the generators: a syntax error in a
# template reaches production and 500s the page, and the Python sweep that got
# pyflakes to a clean state in v1.22.0 was run by hand. Both checks take
# seconds and start green.
#
# Deliberately narrow triggers, same principle as the other two workflows:
# a CSS-only push should not spin up PHP and Python.

on:
  push:
    branches: [main]
    paths:
      - "**/*.php"
      - "**/*.phtml"
      - "scripts/*.py"
      - "scripts/requirements.txt"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**/*.php"
      - "**/*.phtml"
      - "scripts/*.py"
      - "scripts/requirements.txt"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          # Matches the module's `omeka_version_constraint = "^4.0.0"` floor;
          # Omeka S 4 requires PHP 8.1+.
          php-version: "8.1"
          coverage: none

      - name: php -l over every source file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done < <(find src view config Module.php -type f \( -name '*.php' -o -name '*.phtml' \) -print0)
          exit $fail

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pyflakes only: no dependency install, so this stays a seconds-long
      # check. It catches the failure modes that actually happen here —
      # undefined names, unused imports, redefinitions — without needing the
      # heavy scientific stack the generators import at runtime.
      - name: Install pyflakes
        run: pip install pyflakes==3.2.0

      - name: pyflakes over the generators
        run: pyflakes scripts/*.py

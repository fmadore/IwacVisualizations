name: Lint (PHP/Python)

# build-check.yml covers the JS/CSS side (theme tokens, block registry, stale
# .min files). Nothing covered the PHP or the generators: a syntax error in a
# template reaches production and 500s the page, and the Python sweep that got
# pyflakes to a clean state in v1.22.0 was run by hand. Both checks take
# seconds and start green.
#
# Deliberately narrow triggers, same principle as the other two workflows:
# a CSS-only push should not spin up PHP and Python.
#
# Also a reusable workflow: release.yml and regenerate-data.yml call it on
# the tree they publish, and a reusable call ignores the path filters.

on:
  push:
    branches: [main]
    paths:
      - "config/sentiment-models.json"
      - "scripts/build-model-registry.js"
      - "**/*.php"
      - "**/*.phtml"
      - "**/*.py"
      - "ruff.toml"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/python-lock.js"
      - "tests/php/**"
      - "tests/python/**"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "config/sentiment-models.json"
      - "scripts/build-model-registry.js"
      - "**/*.php"
      - "**/*.phtml"
      - "**/*.py"
      - "ruff.toml"
      - "scripts/requirements.txt"
      - "scripts/requirements.lock"
      - "scripts/python-lock.js"
      - "tests/php/**"
      - "tests/python/**"
      - ".github/workflows/lint.yml"
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to check out; empty for the event's own ref.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          # Lower runtime exercised with the literal Omeka S 4.0.0 floor in
          # omeka-integration.yml (the exact production runtime is PHP 8.5).
          php-version: "8.1"
          coverage: none

      - name: php -l over every source file
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=1
            fi
          done < <(find bin src view config Module.php -type f \( -name '*.php' -o -name '*.phtml' \) -print0)
          exit $fail

      - name: PHP behavioral contracts
        run: php tests/php/run.php

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Python generator lock matches its input
        run: node scripts/python-lock.js --check

      # Keep lint isolated from the generator stack. It catches undefined
      # names, unused imports and redefinitions before the focused test
      # dependencies are installed below.
      - name: Install ruff
        run: pip install ruff==0.16.10

      # `datasets` is lazy-loaded at the network boundary; pinned numpy+pandas
      # wheels are enough to exercise and import the pure shared helpers.
      - name: Install Python test dependencies
        run: pip install -r tests/python/requirements.txt

      - name: ruff over the Python
        # No path argument: ruff.toml is the checked-in source of both the
        # rule set (`F` + `E9` — the pyflakes gate this replaced, rule for
        # rule) and the file discovery, so `npm run lint:py` locally and this
        # step cannot drift the way the old explicit `scripts/` did. That
        # argument had already drifted once: it linted the generators and
        # never `tests/python/`, which this now covers.
        run: ruff check .

      # The data validator's own self-test: it proves the checks can fail, so
      # a green "Validate the generated data" in the data workflow means
      # something. No data is needed for this.
      - name: Data validator self-test
        run: python scripts/validate_data.py --self-test

      - name: Python behavioral contracts
        run: python -m unittest discover -s tests/python -v

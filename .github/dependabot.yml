version: 2

# Scope note — this repo has four dependency surfaces and Dependabot is the
# right tool for two of them:
#
#   1. GitHub Actions (below). Covered. Small surface, low noise, and the only
#      surface where a compromised dependency touches a secret. The actions
#      are pinned to commit SHAs with the release in a trailing comment;
#      Dependabot moves both together.
#   2. npm (below) — dev tooling only (esbuild, csso, eslint, stylelint,
#      playwright, …); nothing here ships to visitors. Covered since 2026-10,
#      because nothing proposed the in-range source-map-js fix
#      (GHSA-68fv-2mgg-jv7q) for weeks after IWAC-theme took it, while
#      `npm run check:audit` (build-check.yml) now fails on exactly that kind
#      of advisory. A bump that changes a build output (esbuild, csso) fails
#      `Build check (JS/CSS)` on "built assets are stale" until `npm run build`
#      is committed on the PR branch — those PRs are never auto-mergeable.
#   3. pip — `scripts/requirements.txt` carries loose constraints and the
#      exact, hash-verified pins live in `scripts/requirements.lock`, which
#      `scripts/python-lock.js` regenerates (`npm run lock:python`) and CI
#      installs with `--require-hashes`. NOT covered: Dependabot would bump
#      the constraints file and leave the lock (the thing CI installs)
#      untouched, so `lint:python-lock` would fail every such PR. Refresh
#      the lock deliberately instead.
#   4. The CDN libraries that actually reach visitors' browsers (ECharts,
#      MapLibre GL, d3) are PHP string constants in
#      view/common/iwac-assets.phtml and are invisible to Dependabot entirely.
#      The `CDN versions` workflow covers those instead.
#
# Dependabot *alerts* (the CVE feed) are a separate repo setting, not
# configured by this file.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    # One grouped PR rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    # Security updates arrive as they are published regardless of this
    # schedule; the monthly group is the routine refresh, one PR.
    groups:
      development-tooling:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
    labels:
      - dependencies
